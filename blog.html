}


.read-btn{

    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;

}



/* Buttons */


.arrow{

position:absolute;
top:45%;
background:#2563eb;
color:white;
border:none;
font-size:25px;
padding:10px 15px;
border-radius:50%;
cursor:pointer;

}


.left{

left:-10px;

}


.right{

right:-10px;

@media(max-width:768px){
